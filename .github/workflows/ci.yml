name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_USER_EMAIL: e2e@pbb.test
  E2E_USER_PASSWORD: E2ePassw0rd!
  E2E_USER_NICKNAME: e2euser

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: spring_backend/build/reports/jacoco/test/
          if-no-files-found: error
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start MySQL and Redis
        run: docker compose up -d

      - name: Wait for MySQL and Redis
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T baseball-mysql mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent \
              && docker compose exec -T baseball-redis redis-cli ping | grep -q PONG; then
              echo "infra ready"
              exit 0
            fi
            sleep 2
          done
          echo "infra not ready"
          docker compose ps
          exit 1

      - name: Start Spring Boot (dev,e2e)
        working-directory: spring_backend
        env:
          SPRING_PROFILES_ACTIVE: dev,e2e
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
          E2E_USER_EMAIL: ${{ env.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ env.E2E_USER_PASSWORD }}
          E2E_USER_NICKNAME: ${{ env.E2E_USER_NICKNAME }}
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun --no-daemon > /tmp/spring-e2e.log 2>&1 &
          echo $! > /tmp/spring-e2e.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat /tmp/spring-e2e.log
          exit 1

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Vite preview
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173 >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Playwright smoke
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          E2E_USER_EMAIL: ${{ env.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ env.E2E_USER_PASSWORD }}
        run: npm run test:e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/spring-e2e.log || true
          tail -n 100 /tmp/vite-preview.log || true
          docker compose logs --tail=100 || true
