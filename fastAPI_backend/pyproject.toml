[project]
name = "fastapi-backend"
version = "0.2.0"
description = "PBB FastAPI — Sranko ML (classify + rembg)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=10.0.0",
    "numpy>=1.26.0,<2.5",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.17.0",
    "pymatting>=1.1.15",
    "numba>=0.60.0",
    "pooch>=1.8.0",
    "tqdm>=4.66.0",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
