spring:
  application:
    name: spring_backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Sranko multipart uploads (FE-resized images)
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

info:
  app:
    name: PBB API
    description: Play beom's BAG backend

# Dieta Gemini meal finalize (optional — blank api-key → deterministic stub)
dieta:
  gemini:
    api-key: ${DIETA_GEMINI_API_KEY:}
    base-url: ${DIETA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${DIETA_GEMINI_MODEL:gemini-2.0-flash}

# Sranko Gemini single-call try-on (enabled=false / no project → stub; live uses ADC).
# Legacy fit-* keys still bind but are unused by the try-on path.
sranko:
  vertex:
    enabled: ${SRANKO_VERTEX_ENABLED:false}
    project-id: ${SRANKO_VERTEX_PROJECT_ID:}
    location: ${SRANKO_VERTEX_LOCATION:us-central1}
    model: ${SRANKO_VERTEX_MODEL:gemini-2.5-flash-image}
    fit-enabled: ${SRANKO_VERTEX_FIT_ENABLED:false}
    fit-model: ${SRANKO_VERTEX_FIT_MODEL:gemini-2.5-flash-image}
  ml:
    enabled: ${SRANKO_ML_ENABLED:true}
    base-url: ${SRANKO_ML_BASE_URL:http://127.0.0.1:8000}
  weather:
    api-key: ${WEATHERAPI_KEY:}
    base-url: ${WEATHERAPI_BASE_URL:https://api.weatherapi.com}
    try-on:
    body-cache-enabled: ${SRANKO_TRYON_BODY_CACHE_ENABLED:true}
    ephemeral-ttl: ${SRANKO_TRYON_EPHEMERAL_TTL:1h}
    ephemeral-cleanup-enabled: ${SRANKO_TRYON_EPHEMERAL_CLEANUP_ENABLED:true}
    ephemeral-cleanup-interval-ms: ${SRANKO_TRYON_EPHEMERAL_CLEANUP_INTERVAL_MS:60000}
    result-cache-enabled: ${SRANKO_TRYON_RESULT_CACHE_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET_KEY:dev-only-secret-key-must-be-long-enough-for-hs256-signing!!}
    access-token-expiry: 30m
    refresh-token-expiry: 7d
    pos-token-expiry: 12h
  cookie:
    refresh-token-name: refreshToken
    secure: ${COOKIE_SECURE:false}
    # 프론트/백엔드 도메인이 다르면 prod 에서 None 필요 (crossdomain 쿠키). 로컬 dev 기본값 Strict.
    same-site: ${COOKIE_SAME_SITE:Strict}
    path: /api/v1/auth
  mail:
    # 발신 주소 (발송 도메인 인증 필요). prod 는 MAIL_FROM 으로 no-reply@<도메인> 주입.
    from: ${MAIL_FROM:no-reply@pbb.com}
  # Cloudflare R2 설정은 application-dev.yaml / application-prod.yaml 에서 프로필별로 관리
